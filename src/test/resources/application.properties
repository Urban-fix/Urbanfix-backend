spring.application.name=urbanfix-backend-test

# Disable email in tests
email.enabled=false
spring.mail.host=disabled

# JWT Configuration (test values)
jwt.secret=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
jwt.expiration-access=3600000
jwt.expiration-refresh=86400000
password-reset.token-expiration-minutes=15

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# File upload test
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=/tmp/test-uploads
app.base-url=http://localhost:8080

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
